<!doctype html><html><head><meta charset="utf-8"><style>
:root{--paper:#F4F6FB;--card:#FFFFFF;--ink:#1A2340;--ink2:#4E5874;--ink3:#8790A8;--line:#DDE2EE;--a:#2F5BFF;--asoft:#E6ECFF;--b:#13B5A6;--bsoft:#DDF6F3;--review:#FF8A3D;--reviewsoft:#FFEBDD;--reviewcell:#FFC9A3;--neutral:#1A2340;--neutralsoft:#E7EAF3;--scan:#8FA4FF;--scandim:#C9D3F5;--dim:#DDE2EE;--dim2:#E8ECF4}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 14px 35px rgba(43,57,102,.08)}button{font:inherit}.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;background:var(--neutralsoft);color:var(--ink2);font-size:11px;font-weight:800;text-transform:lowercase}.chip.review_needed{background:var(--reviewsoft);color:#8A3A05}.chip.descriptive_only{background:var(--asoft);color:#1E3AB8}.chip.insufficient_evidence{background:var(--neutralsoft);color:var(--ink2)}.chip.no_patterns_found,.chip.accepted{background:var(--neutralsoft);color:var(--neutral)}.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--ink3)}.title{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;color:var(--ink)}.muted{color:var(--ink2)}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.statusTile{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px;min-width:0}.statusValue{font-weight:800;font-size:18px;margin:5px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mosaicTop{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-bottom:12px}.lenses{display:flex;gap:6px;flex-wrap:wrap}.lens{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink2);padding:7px 10px;font-weight:750;font-size:11px;cursor:pointer}.lens[aria-pressed="true"]{background:var(--ink);color:white;border-color:var(--ink);box-shadow:0 0 18px rgba(47,91,255,.22)}.lens:focus-visible,canvas:focus-visible{outline:3px solid #8FA4FF;outline-offset:2px}.mosaicGrid{display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:15px}.canvasWrap{position:relative;overflow:hidden;background:linear-gradient(145deg,#f8faff,#f3f6fc);border:1px solid var(--line);border-radius:17px;padding:10px;min-height:310px}.canvasWrap.scanning:after{content:"";position:absolute;inset:0;width:28%;background:linear-gradient(90deg,transparent,rgba(47,91,255,.15),transparent);animation:sweepAcross .7s ease both;pointer-events:none}canvas{width:100%;height:288px;display:block}.readout{border-radius:17px;background:linear-gradient(145deg,var(--ink),#28365d);padding:16px;color:white;display:flex;flex-direction:column;justify-content:space-between}.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:42px;font-weight:850;letter-spacing:-.05em}.readout p{font-size:12px;line-height:1.5;color:#dce3f8}.tooltip{position:absolute;display:none;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.45;box-shadow:0 10px 28px rgba(0,0,0,.2);z-index:5}.caption{font-size:11px;color:var(--ink3);margin-top:9px}
.coverage{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:center}.ring{--p:0;position:relative;width:160px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--scan) calc(var(--p)*1%),var(--neutralsoft) 0);display:grid;place-items:center;margin:auto}.ring:after{content:"";position:absolute;inset:17px;border-radius:50%;background:var(--card)}.ringText{position:relative;z-index:1;text-align:center}.ringText strong{display:block;font-size:25px}.columns{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.scanChip{padding:5px 8px;border-radius:999px;background:var(--neutralsoft);font-size:10px;color:var(--ink2)}.scanChip.done{background:var(--asoft);color:#1E3AB8}.callout{padding:10px 12px;border-left:3px solid var(--neutral);background:var(--neutralsoft);border-radius:0 10px 10px 0;font-size:12px;color:var(--ink2)}
.waffle{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:270px;margin:14px auto}.waffle i,.mini i{display:block;aspect-ratio:1;border-radius:3px;background:var(--dim)}.waffle i.a{background:var(--a)}.waffle i.b{background:var(--b)}.waffle i.c{background:var(--review)}.waffle i.missing{background:var(--dim2);box-shadow:inset 0 0 0 1px var(--ink3)}.waffle i.reference{outline:2px solid var(--neutral);outline-offset:1px}.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}.ledger>div{border:1px solid var(--line);border-radius:14px;padding:10px}.ledger strong{display:block;font-size:20px;margin-top:4px}.changeBody{display:grid;grid-template-columns:1fr 230px;gap:14px}.mini{display:grid;grid-template-columns:repeat(40,1fr);gap:2px;border:1px solid var(--line);border-radius:14px;padding:10px;background:#f8faff}.mini i{border-radius:1px;background:var(--scandim)}.mini i.remove{background:var(--review);animation:drop .45s both}.fingerprints{display:grid;gap:8px}.fpCard{position:relative;border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:center}.identicon{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:58px}.identicon i{aspect-ratio:1;border-radius:2px;background:var(--dim2)}.identicon i.on{background:var(--a)}.stamp{display:inline-block;margin-top:6px;padding:4px 7px;border:2px solid var(--a);color:var(--a);border-radius:6px;font-size:10px;font-weight:900;transform:rotate(-2deg);animation:stamp .4s both}.protected{margin-top:10px;font-size:11px;color:var(--ink2)}
@keyframes sweep{from{filter:brightness(1);box-shadow:0 0 0 rgba(47,91,255,0)}50%{filter:brightness(1.08);box-shadow:0 0 32px rgba(47,91,255,.2)}to{filter:brightness(1);box-shadow:0 0 0 rgba(47,91,255,0)}}@keyframes sweepAcross{from{transform:translateX(-110%)}to{transform:translateX(470%)}}@keyframes drop{to{opacity:.3;transform:translateY(3px)}}@keyframes stamp{from{opacity:0;transform:scale(1.5) rotate(-2deg)}to{opacity:1;transform:scale(1) rotate(-2deg)}}
@media(prefers-color-scheme:dark){:root{--paper:#0F1424;--card:#171E33;--ink:#EEF1FA;--ink2:#AEB6CC;--ink3:#7E89A6;--line:#29324B;--a:#6F8DFF;--asoft:#27365f;--b:#2FD1C1;--bsoft:#193c40;--review:#FF9D5C;--reviewsoft:#4b2b24;--neutral:#C9D2EA;--neutralsoft:#27304A;--scan:#6F8DFF;--scandim:#34427A;--dim:#27304A;--dim2:#1E2640}.canvasWrap,.mini{background:#12192a}.readout{background:linear-gradient(145deg,#202b49,#111827)}}
body.dark{--paper:#0F1424;--card:#171E33;--ink:#EEF1FA;--ink2:#AEB6CC;--ink3:#7E89A6;--line:#29324B;--a:#6F8DFF;--asoft:#27365f;--b:#2FD1C1;--bsoft:#193c40;--review:#FF9D5C;--reviewsoft:#4b2b24;--neutral:#C9D2EA;--neutralsoft:#27304A;--scan:#6F8DFF;--scandim:#34427A;--dim:#27304A;--dim2:#1E2640}body.dark .canvasWrap,body.dark .mini{background:#12192a}body.dark .readout{background:linear-gradient(145deg,#202b49,#111827)}
@media(max-width:640px){.status{grid-template-columns:repeat(2,1fr)}.mosaicTop{grid-template-columns:1fr}.mosaicGrid,.coverage,.changeBody{grid-template-columns:1fr}.readout{min-height:150px}.ledger{grid-template-columns:repeat(2,1fr)}.mini{grid-template-columns:repeat(24,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="root"></main><div class="tooltip" id="tip"></div><script>
const d=__MEDGUARD_PAYLOAD__;const root=document.getElementById('root');const tip=document.getElementById('tip');
function syncTheme(){try{const bg=getComputedStyle(parent.document.querySelector('.stApp')).backgroundColor,m=bg.match(/\d+/g),dark=m&&((+m[0]*299 + +m[1]*587 + +m[2]*114)/1000)<128;document.body.classList.toggle('dark',!!dark);dispatchEvent(new Event('mgtheme'))}catch(e){document.body.classList.toggle('dark',matchMedia('(prefers-color-scheme: dark)').matches)}}syncTheme();try{new MutationObserver(syncTheme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']})}catch(e){}
const label=s=>String(s).replaceAll('_',' ');const chip=s=>`<span class="chip ${s}">${label(s)}</span>`;const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function identicon(hash){if(!hash)return '<div class="identicon"></div>';const bits=[...hash.slice(0,15)].map(x=>parseInt(x,16)%2);let h='';for(let r=0;r<5;r++){const row=[bits[r*3],bits[r*3+1],bits[r*3+2],bits[r*3+1],bits[r*3]];row.forEach(v=>h+=`<i class="${v?'on':''}"></i>`)}return `<div class="identicon">${h}</div>`}
function status(){root.innerHTML=`<section class="status" aria-label="Measured audit status">${d.tiles.map(t=>`<article class="statusTile"><div class="eyebrow">${t.label}</div><div class="statusValue">${t.value}</div>${chip(t.status)}</article>`).join('')}</section>`;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)root.querySelectorAll('.statusValue').forEach(el=>{const m=el.textContent.match(/^([\d,]+)(.*)$/);if(!m)return;const target=Number(m[1].replaceAll(',','')),suffix=m[2],start=performance.now();function tick(now){const p=Math.min(1,(now-start)/550);el.textContent=Math.round(target*p).toLocaleString()+suffix;if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)})}
function mosaic(){const sample=d.sampled?`Even sample of ${d.sampleCount.toLocaleString()} of ${d.rowCount.toLocaleString()} rows.`:`All ${d.rowCount.toLocaleString()} rows shown.`;root.innerHTML=`<section class="card"><div class="mosaicTop"><div><div class="eyebrow">Interactive evidence map</div><div class="title">One square per ${d.sampled?'sampled ':''}row</div></div><div class="lenses" role="group" aria-label="Mosaic lens"><button class="lens" data-lens="cohort">Cohort</button><button class="lens" data-lens="missing">Missing values</button><button class="lens" data-lens="duplicate">Duplicates</button><button class="lens" data-lens="identifier">Identifier scan</button></div></div><div class="mosaicGrid"><div class="canvasWrap"><canvas tabindex="0" aria-label="Row-level aggregate evidence mosaic; use the lens buttons to change the view"></canvas></div><aside class="readout"><div><div class="eyebrow" style="color:#aebbe3">Active lens</div><div class="big"></div></div><p></p></aside></div><div class="caption">${sample} Hover or tap a square for aggregate row flags. The source is unchanged.</div></section>`;const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),buttons=[...root.querySelectorAll('.lens')],big=root.querySelector('.big'),copy=root.querySelector('.readout p');let lens='cohort',cells=[];function paint(animate=true){const ratio=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*ratio;canvas.height=h*ratio;ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);const cols=Math.ceil(Math.sqrt(d.rows.length*w/h)),gap=2,size=Math.max(2,Math.min((w-gap*(cols-1))/cols,(h-gap*(Math.ceil(d.rows.length/cols)-1))/Math.ceil(d.rows.length/cols)));cells=[];d.rows.forEach((r,i)=>{const x=(i%cols)*(size+gap),y=Math.floor(i/cols)*(size+gap);let c=css('--dim');if(lens==='cohort')c=r.group<0?css('--dim'):r.group%2===0?css('--a'):css('--b');if(lens==='missing')c=(r.selectedMissing||r.missing>=2)?css('--review'):r.missing===1?css('--reviewcell'):css('--dim2');if(lens==='duplicate')c=r.duplicate?css('--review'):css('--dim2');if(lens==='identifier')c=css('--scan');ctx.fillStyle=c;ctx.fillRect(x,y,size,size);cells.push({x,y,size,r})});const missing=d.quality.missing_cells,dupes=d.quality.duplicate_rows;if(lens==='cohort'){big.textContent=d.labels.length?d.labels.length:'—';copy.textContent=d.labels.length?'Recorded cohort labels. Labels are shown exactly as recorded.':'Choose a demographic column to map cohort labels.'}if(lens==='missing'){big.textContent=missing.toLocaleString();copy.textContent='Missing cells measured across the validated table.'}if(lens==='duplicate'){big.textContent=dupes.toLocaleString();copy.textContent='Rows that belong to an exact duplicate set.'}if(lens==='identifier'){big.textContent=d.screening.matches.toLocaleString();copy.textContent='This is screening, not clearance. No matched patterns does not establish HIPAA de-identification.'}buttons.forEach(b=>b.setAttribute('aria-pressed',b.dataset.lens===lens));if(animate){const wrap=canvas.parentElement;wrap.classList.remove('scanning');void wrap.offsetWidth;wrap.classList.add('scanning')}};function point(e){const rect=canvas.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left,y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;const c=cells.find(c=>x>=c.x&&x<c.x+c.size&&y>=c.y&&y<c.y+c.size);if(!c){tip.style.display='none';return}const group=c.r.group<0?'not recorded':d.labels[c.r.group];tip.innerHTML=`Row ${c.r.row}<br>Group: ${group}<br>Missing columns: ${c.r.missing}<br>Exact duplicate: ${c.r.duplicate?'yes':'no'}`;tip.style.display='block';tip.style.left=Math.min(innerWidth-170,(e.touches?e.touches[0].clientX:e.clientX)+8)+'px';tip.style.top=Math.max(4,(e.touches?e.touches[0].clientY:e.clientY)-54)+'px'}buttons.forEach(b=>b.onclick=()=>{lens=b.dataset.lens;paint()});canvas.onmousemove=point;canvas.onmouseleave=()=>tip.style.display='none';canvas.ontouchstart=point;new ResizeObserver(()=>paint(false)).observe(canvas);addEventListener('mgtheme',()=>paint(false));matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>paint(false));paint(false)}
function identifier(){const pct=d.rowCount?Math.round(d.rowsScanned/d.rowCount*100):0;root.innerHTML=`<section class="card coverage"><div class="ring" aria-label="${pct}% of cells screened"><div class="ringText"><strong>${pct}%</strong><span class="muted">cells scanned</span></div></div><div><div class="eyebrow">Identifier screening coverage</div><div class="title" style="font-size:21px;margin:5px 0">${d.columnCount} of ${d.columnCount} columns scanned · ${d.matches} matched</div>${chip(d.status)}<div class="columns">${Array.from({length:Math.min(d.columnCount,18)},(_,i)=>`<span class="scanChip">Column ${i+1} · scanned</span>`).join('')}</div><div class="callout">This is screening, not clearance. No matched patterns does not establish HIPAA de-identification.</div></div></section>`;const ring=root.querySelector('.ring');requestAnimationFrame(()=>ring.style.setProperty('--p',pct));const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;root.querySelectorAll('.scanChip').forEach((el,i)=>setTimeout(()=>el.classList.add('done'),reduced?0:i*45))}
function waffle(){let cells=[],cursor=0,total=d.observedCount+d.missingCount;d.groups.forEach((g,gi)=>{const n=Math.round((g.count/Math.max(total,1))*100),ref=Math.round((g.reference_proportion||0)*100);for(let i=0;i<n&&cursor<100;i++,cursor++)cells.push(`<i class="${gi===0?'a':gi===1?'b':'c'} ${i<ref?'reference':''}" title="${g.label}${g.reference_proportion!==null?' · reference '+(g.reference_proportion*100).toFixed(1)+'%':''}"></i>`)});const missingN=Math.round((d.missingCount/Math.max(total,1))*100);for(let i=0;i<missingN&&cells.length<100;i++)cells.push('<i class="missing" title="Missing value"></i>');while(cells.length<100)cells.push('<i title="Rounding remainder"></i>');root.innerHTML=`<section class="card"><div class="eyebrow">100-square cohort view</div><div class="title" style="font-size:18px;margin:4px 0">Each square represents about 1% of all rows</div><div class="waffle" role="img" aria-label="Cohort share waffle for ${d.column}">${cells.join('')}</div><div class="legend">${d.groups.map((g,i)=>`<span><i class="dot" style="background:${i===0?css('--a'):i===1?css('--b'):css('--review')}"></i>${g.label} ${g.proportion===null?'unavailable':(g.proportion*100).toFixed(1)+'%'}</span>`).join('')}<span><i class="dot" style="background:var(--dim)"></i>${d.missingCount} missing</span></div><div class="caption">Denominator: ${d.observedCount.toLocaleString()} non-missing values. Missing values are a separate gray segment. Navy outlines show supplied reference shares.</div></section>`}
function changes(){root.innerHTML=`<section class="card"><div class="ledger"><div><span class="eyebrow">Source rows · locked</span><strong>${d.sourceRows.toLocaleString()}</strong></div><div><span class="eyebrow">Rows removed</span><strong>${d.removedRows.toLocaleString()}</strong></div><div><span class="eyebrow">Rows in copy</span><strong>${d.copyRows.toLocaleString()}</strong></div><div><span class="eyebrow">Cells filled</span><strong>${d.cellsFilled.toLocaleString()}</strong></div></div><div class="changeBody"><div><div class="eyebrow">Preview row map</div><div class="mini" role="img" aria-label="Preview map with removed rows highlighted">${d.rows.map(r=>`<i class="${r.removed?'remove':''}" title="Row ${r.row}${r.removed?' removed from copy':''}"></i>`).join('')}</div><div class="caption">Tangerine rows are removed from the separate copy. The source remains locked.</div></div><div class="fingerprints"><div class="fpCard">${identicon(d.sourceFingerprint)}<div><b>Source dataset</b><div class="muted">fingerprint unchanged</div></div></div>${d.outputFingerprint?`<div class="fpCard">${identicon(d.outputFingerprint)}<div><b>Reviewed copy</b><div class="muted">separate fingerprint</div>${d.accepted?'<span class="stamp">ready to export</span>':''}</div></div>`:''}</div></div><div class="protected"><b>Never changed by default:</b> ${d.protected.length?d.protected.join(' · '):'No protected roles assigned'}</div></section>`}
({status,mosaic,identifier,waffle,changes}[d.kind]||(()=>{root.textContent='Visual unavailable.'}))();
</script></body></html>
