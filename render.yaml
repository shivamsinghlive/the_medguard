# Render Blueprint for the public MedGuard Explorer demo (free plan: 512 MB, sleeps when idle).
services:
  - type: web
    name: medguard-explorer
    runtime: docker
    plan: free
    branch: shivam/public-demo
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Smaller limits keep the free plan's memory safe; raise them on a paid plan.
      - key: MEDGUARD_MAX_UPLOAD_MB
        value: "10"
      - key: MEDGUARD_MAX_ROWS
        value: "50000"
      - key: MEDGUARD_MAX_SESSIONS
        value: "30"
      # Hosted AI. Groq (OpenAI-compatible, Llama) by default; for Claude set the provider to
      # "anthropic" and the model to a Claude model ID. The key is entered in the Render
      # dashboard and never stored in this repository.
      - key: MEDGUARD_AI_PROVIDER
        value: openai
      - key: MEDGUARD_AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: MEDGUARD_AI_MODEL
        value: llama-3.1-8b-instant
      - key: MEDGUARD_AI_API_KEY
        sync: false
